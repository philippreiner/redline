<!doctype html>
<!-- Scope fixture: two bands of one list, as on Antasar's Learnings > Systems (ListBand and
     ReviewBand). Both headings are h2 elements with only utility classes, so their name through the
     list's handle, ul[data-slot="list"] h2, matches both. "Items" starts 28px before "To review" and
     before its own rows' text: the fix must move "Items" and leave "To review" where it is. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Systems</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { font: 14px/20px system-ui, sans-serif; color: #1d1d1b; background: #fafaf8; }
      main { max-width: 960px; margin: 32px auto; background: #fff; border: 1px solid #e6e4df; border-radius: 8px; }
      header { padding: 20px 24px 12px; }
      header h1 { font-size: 18px; line-height: 24px; font-weight: 600; }
      .grid { display: grid; grid-template-columns: 1fr auto; }
      .contents { display: contents; }
      .col-span-full { grid-column: 1 / -1; }
      .flex { display: flex; }
      .items-center { align-items: center; }
      .items-end { align-items: flex-end; }
      .gap-3 { gap: 12px; }
      .h-bar { height: 40px; }
      .min-h-9 { min-height: 36px; }
      .px-gutter { padding-inline: 24px; }
      .pt-2 { padding-top: 8px; }
      .pb-1 { padding-bottom: 4px; }
      .text-meta { font-size: 12px; line-height: 16px; }
      .font-medium { font-weight: 500; }
      .text-ink-2 { color: #5d5a54; }
      .min-w-0 { min-width: 0; }
      .row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; min-height: 44px; padding-inline: 24px; border-top: 1px solid #efede8; }
      .row .lead { display: flex; align-items: center; gap: 12px; }
      .box { width: 16px; height: 16px; border: 1px solid #b9b5ad; border-radius: 4px; flex: none; }
      .icon { width: 16px; height: 16px; border-radius: 4px; background: #d9d5cc; flex: none; }
      .when { color: #5d5a54; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <header><h1>Systems</h1></header>
      <div data-slot="list-page-body" data-testid="list-scroll">
        <ul data-slot="list" class="grid">
          <li data-testid="learnings-review" class="contents">
            <div class="col-span-full flex h-bar items-center gap-3 px-gutter pt-2 text-meta font-medium text-ink-2">
              <span class="box" role="checkbox" aria-checked="false" aria-label="Select all"></span>
              <h2 class="min-w-0">To review</h2>
            </div>
            <div class="row"><span class="lead"><span class="box" role="checkbox" aria-checked="false" aria-label="Select"></span>SAP S/4HANA: cutover window moved to March</span><span class="when">2 days ago</span></div>
            <div class="row"><span class="lead"><span class="box" role="checkbox" aria-checked="false" aria-label="Select"></span>Salesforce: SSO via Entra ID is live</span><span class="when">3 days ago</span></div>
          </li>
          <li class="contents">
            <h2 class="col-span-full flex min-h-9 items-end px-gutter pt-2 pb-1 text-meta font-medium text-ink-2">Items</h2>
            <div class="row"><span class="lead"><span class="icon"></span>ServiceNow ITSM</span><span class="when">12 learnings</span></div>
            <div class="row"><span class="lead"><span class="icon"></span>Jira Cloud</span><span class="when">8 learnings</span></div>
            <div class="row"><span class="lead"><span class="icon"></span>Workday HCM</span><span class="when">5 learnings</span></div>
            <div class="row"><span class="lead"><span class="icon"></span>Microsoft Entra ID</span><span class="when">4 learnings</span></div>
          </li>
        </ul>
      </div>
    </main>
  </body>
</html>
