<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meeting rail (rebuilt from screenshot)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Newsreader:opsz,wght@6..72,200..800&family=Geist+Mono:wght@100..900&display=block">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:400 13px/20px "Inter",sans-serif;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;color:#111;background:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block;flex:none}
.page{display:flex;width:495px;height:440px;overflow:hidden}
.main{width:103px}
.main .head{height:40px;border-bottom:1px solid #f1f1f1;position:relative}
.main .more{position:absolute;left:57px;top:4px;width:28px;height:28px;display:grid;place-items:center;color:#525252}
.rail{flex:1;border-left:1px solid #f1f1f1}
.sec{padding:27px 24px 33px;border-top:1px solid #f1f1f1}
.sec:first-child{padding-top:7px;padding-bottom:39px;border-top:0}
h2{font-size:13px;font-weight:500}
dl{margin-top:20px}
.prop{display:flex;align-items:flex-start}
.prop+.prop{margin-top:12px}
dt{width:104px;color:#6b6b6b}
dd{display:flex;flex-direction:column;align-items:flex-start}
.val{display:flex;align-items:center;gap:9px;padding-left:2px}
.val svg{color:#6b6b6b}
.helper{margin:4px 0 0 -1px;font-size:12px;line-height:16px;color:#6b6b6b;text-decoration:underline dotted #9a9a9a;text-underline-offset:3px;cursor:help}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 3px 0 5px;border-radius:6px;background:#f5f5f5;font-size:12px;font-weight:600}
.chip svg{color:#6b6b6b}
.chip button{display:grid;place-items:center;width:16px;height:16px;color:#6b6b6b}
ul{list-style:none;margin-top:12px}
li+li{margin-top:8px}
.quiet{display:flex;align-items:center;gap:5px;height:28px;margin:12px 0 0 -7px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;color:#525252}
.quiet:hover{background:rgb(0 0 0 / .035)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="stack" viewBox="0 0 24 24"><path d="M12 2 21 6.5 12 11 3 6.5Z" fill="currentColor" fill-opacity=".35" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M3 11.5 12 16l9-4.5M3 16.5 12 21l9-4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></symbol>
</svg>
<div class="page">
  <div class="main">
    <div class="head">
      <button class="more" aria-label="More actions"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="19" cy="12" r="2.1"/></svg></button>
    </div>
  </div>
  <aside class="rail" id="rail">
    <section class="sec">
      <h2>Details</h2>
      <dl>
        <div class="prop">
          <dt>Program</dt>
          <dd>
            <button class="val"><svg width="12" height="12"><use href="#stack"/></svg>Local Demo</button>
            <span class="helper" title="Picked from the meeting title and attendees">Assigned automatically</span>
          </dd>
        </div>
        <div class="prop">
          <dt>Workstreams</dt>
          <dd>
            <span class="chip"><svg width="12" height="12"><use href="#stack"/></svg>CMMS Rollout<button aria-label="Remove CMMS Rollout"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>
          </dd>
        </div>
      </dl>
    </section>
    <section class="sec">
      <h2>People</h2>
      <ul><li>Alex Member</li><li>E2E Owner</li></ul>
    </section>
    <section class="sec">
      <h2>Thread</h2>
      <button class="quiet">Run routine<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    </section>
  </aside>
</div>
</body>
</html>
